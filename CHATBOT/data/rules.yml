version: "3.1"

rules:
  - rule: Chào hỏi khách hàng
    steps:
      - intent: greet
      - action: utter_greet

  - rule: Phản hồi khi khách hỏi bot là ai
    steps:
      - intent: bot_challenge
      - action: utter_iamabot

  - rule: Tạm biệt khách hàng
    steps:
      - intent: goodbye
      - action: utter_goodbye

  - rule: Tìm kiếm sản phẩm theo yêu cầu
    steps:
      - intent: tim_san_pham
      - action: action_search_product

  - rule: Tìm sản phẩm mới nhất
    steps:
      - intent: hoi_san_pham_moi
      - action: action_search_product

  - rule: Kiểm tra tồn kho sản phẩm
    steps:
      - intent: hoi_ton_kho
      - action: action_search_product

  - rule: Xem sản phẩm đang giảm giá
    steps:
      - intent: hoi_khuyen_mai
      - action: action_search_product

  - rule: Xem sản phẩm bán chạy/hot
    steps:
      - intent: hoi_san_pham_hot
      - action: action_search_product

  - rule: Phản hồi mặc định khi không hiểu ý khách
    steps:
      - intent: nlu_fallback
      - action: utter_default