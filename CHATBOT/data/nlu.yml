version: "3.1"

nlu:
- intent: greet
  examples: |
    - chào
    - hello
    - hi
    - chào bot

- intent: goodbye
  examples: |
    - tạm biệt
    - bye
    - cút
    - thôi mình đi đây

- intent: bot_challenge
  examples: |
    - bạn là ai?
    - bạn là người hay máy?
    - bot à?

- intent: tim_san_pham
  examples: |
    - tìm [iphone](product_name)
    - xem [laptop](category) của [apple](brand)
    - cho mình xem [chuột](category) [logitech](brand)

- intent: hoi_san_pham_moi
  examples: |
    - có gì [mới](filter_new) không?
    - hàng [mới về](filter_new)
    - xem [sản phẩm mới nhất](filter_new)