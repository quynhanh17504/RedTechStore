version: "3.1"

intents:
  - greet
  - goodbye
  - tim_san_pham
  - hoi_san_pham_moi
  - bot_challenge

entities:
  - category
  - brand
  - product_name
  - filter_new

slots:
  category:
    type: text
    influence_conversation: true
    mappings:
      - type: from_entity
        entity: category
  brand:
    type: text
    influence_conversation: true
    mappings:
      - type: from_entity
        entity: brand
  product_name:
    type: text
    influence_conversation: true
    mappings:
      - type: from_entity
        entity: product_name
  filter_new:
    type: text
    influence_conversation: true
    mappings:
      - type: from_entity
        entity: filter_new

responses:
  utter_greet:
    - text: "Chào bạn! Mình là RT Bot 🤖. Bạn muốn tìm sản phẩm, thương hiệu hay xem các mẫu mới nhất tại RedTech Store?"
  
  utter_goodbye:
    - text: "Tạm biệt! Hy vọng bạn đã chọn được món đồ công nghệ ưng ý. Hẹn gặp lại!"

  utter_iamabot:
    - text: "Mình là RT Bot, trợ lý ảo thông minh của RedTech Store. Mình có thể giúp bạn tìm kiếm sản phẩm nhanh chóng!"

  utter_default:
    - text: "Xin lỗi, RT Bot chưa hiểu ý bạn. Bạn có thể thử hỏi: 'Tìm iPhone 15' hoặc 'Laptop Dell mới nhất' được không?"

actions:
  - action_search_product

session_config:
  session_expiration_time: 60
  carry_over_slots_to_new_session: true