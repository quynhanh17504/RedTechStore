version: "3.1"

rules:
  - rule: Chào hỏi khách hàng
    steps:
      - intent: greet
      - action: utter_greet

  - rule: Phản hồi khi khách hỏi bot là ai
    steps:
      - intent: bot_challenge
      - action: utter_iamabot

  - rule: Tạm biệt khách hàng
    steps:
      - intent: goodbye
      - action: utter_goodbye

  - rule: Tìm kiếm sản phẩm (Tên, Danh mục, Thương hiệu)
    steps:
      - intent: tim_san_pham
      - action: action_search_product

  - rule: Kiểm tra tồn kho sản phẩm
    steps:
      - intent: hoi_ton_kho
      - action: action_search_product

  - rule: Xem sản phẩm đang giảm giá (Flash Sale)
    steps:
      - intent: hoi_khuyen_mai
      - action: action_search_product

  - rule: Xem sản phẩm bán chạy (Hot)
    steps:
      - intent: hoi_san_pham_hot
      - action: action_search_product

  # --- QUAN TRỌNG: CHUYỂN CÂU HỎI NGOÀI LỀ SANG GEMINI ---
  - rule: Phản hồi thông minh bằng Gemini khi không hiểu ý khách (Fallback)
    steps:
      - intent: nlu_fallback
      - action: action_gemini_talk

  # Rule này đảm bảo nếu Rasa hoàn toàn không tự tin về Intent nào (nthreshold thấp)
  # nó cũng sẽ đẩy sang Gemini xử lý thay vì im lặng.
  - rule: Out of scope fallback
    steps:
      - intent: out_of_scope
      - action: action_gemini_talk