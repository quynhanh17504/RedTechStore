version: "3.1"

rules:
  - rule: Chào hỏi khách hàng
    steps:
      - intent: greet
      - action: utter_greet

  - rule: Phản hồi khi khách hỏi bot là ai
    steps:
      - intent: bot_challenge
      - action: utter_iamabot

  - rule: Tạm biệt khách hàng
    steps:
      - intent: goodbye
      - action: utter_goodbye

  # --- NHÓM TRA CỨU SẢN PHẨM (GỌI ACTION SERVER) ---
  - rule: Tìm kiếm sản phẩm (Tên, Danh mục, Thương hiệu)
    steps:
      - intent: tim_san_pham
      - action: action_search_product

  - rule: Kiểm tra tồn kho sản phẩm
    steps:
      - intent: hoi_ton_kho
      - action: action_search_product

  - rule: Xem sản phẩm đang giảm giá (Flash Sale)
    steps:
      - intent: hoi_khuyen_mai
      - action: action_search_product

  - rule: Xem sản phẩm bán chạy (Hot)
    steps:
      - intent: hoi_san_pham_hot
      - action: action_search_product

  # --- NHÓM XỬ LÝ THÔNG MINH (GEMINI FALLBACK) ---
  # Rule này bắt các intent ngoài lề đã định nghĩa trong nlu.yml
  - rule: Phản hồi thông minh bằng Gemini khi khách hỏi ngoài lề
    steps:
      - intent: nlu_fallback
      - action: action_gemini_talk

  # Rule này xử lý khi Rasa hoàn toàn không nhận diện được intent (Out of scope)[cite: 5]
  - rule: Xử lý khi nằm ngoài phạm vi hiểu biết
    steps:
      - intent: out_of_scope
      - action: action_gemini_talk