version: "3.1"

intents:
  - greet
  - goodbye
  - bot_challenge
  - tim_san_pham
  - hoi_san_pham_moi
  - hoi_ton_kho       
  - hoi_khuyen_mai   
  - hoi_san_pham_hot 
  - nlu_fallback        # Thêm intent này để xử lý khi bot không hiểu

entities:
  - category
  - brand
  - product_name
  - filter_new
  - filter_stock      
  - filter_sale    
  - filter_hot       

slots:
  category:
    type: text
    influence_conversation: true
    mappings:
      - type: from_entity
        entity: category
  brand:
    type: text
    influence_conversation: true
    mappings:
      - type: from_entity
        entity: brand
  product_name:
    type: text
    influence_conversation: true
    mappings:
      - type: from_entity
        entity: product_name
  filter_new:
    type: text
    influence_conversation: true
    mappings:
      - type: from_entity
        entity: filter_new
  filter_stock:
    type: text
    influence_conversation: true
    mappings:
      - type: from_entity
        entity: filter_stock
  filter_sale:
    type: text
    influence_conversation: true
    mappings:
      - type: from_entity
        entity: filter_sale
  filter_hot:
    type: text
    influence_conversation: true
    mappings:
      - type: from_entity
        entity: filter_hot

responses:
  utter_greet:
    - text: "Chào bạn! Mình là RT Bot 🤖. Bạn muốn tìm sản phẩm, xem hàng Flash Sale hay các mẫu mới nhất tại RedTech Store?"
  
  utter_goodbye:
    - text: "Tạm biệt! Hy vọng bạn đã chọn được món đồ công nghệ ưng ý tại RedTech Store. Hẹn gặp lại!"

  utter_iamabot:
    - text: "Mình là RT Bot, trợ lý ảo thông minh của RedTech Store. Mình có thể giúp bạn tra cứu tồn kho, tìm sản phẩm và săn sale cực nhanh!"

  utter_default:
    - text: "Dạ, RT Bot chưa hiểu ý bạn lắm. Để mình nối máy cho trợ lý AI thông minh hơn giải đáp giúp bạn nhé..."

actions:
  - action_search_product
  - action_gemini_talk    # Bắt buộc phải khai báo action mới ở đây

session_config:
  session_expiration_time: 60
  carry_over_slots_to_new_session: true